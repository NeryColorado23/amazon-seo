<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-logo">&#9670;</span>
      <h1>Crear cuenta</h1>
      <p>Regístrate para optimizar tus listados</p>
    </div>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" [(ngModel)]="name" name="name" placeholder="Tu nombre" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" required />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Mínimo 6 caracteres" required />
      </div>

      <div class="form-group">
        <label>Empresa (opcional)</label>
        <input type="text" [(ngModel)]="company" name="company" placeholder="Nombre de tu empresa" />
      </div>

      <div class="security-section">
        <h3>🔐 Pregunta de seguridad</h3>
        <p class="security-hint">La usarás si olvidas tu contraseña</p>

        <div class="form-group">
          <label>Selecciona una pregunta</label>
          <select [(ngModel)]="securityQuestion" name="securityQuestion" required>
            <option value="">-- Selecciona --</option>
            <option *ngFor="let q of questions" [value]="q">{{ q }}</option>
          </select>
        </div>

        <div class="form-group" *ngIf="securityQuestion === 'Pregunta personalizada...'">
          <label>Escribe tu pregunta</label>
          <input type="text" [(ngModel)]="customQuestion" name="customQuestion" placeholder="Tu pregunta..." required />
        </div>

        <div class="form-group" *ngIf="securityQuestion">
          <label>Tu respuesta</label>
          <input type="text" [(ngModel)]="securityAnswer" name="securityAnswer" placeholder="Respuesta (no distingue mayúsculas)" required />
        </div>
      </div>

      <p class="error-msg" *ngIf="error">{{ error }}</p>

      <button class="btn btn-primary btn-full" type="submit"
        [disabled]="loading || !name || !email || !password || !securityQuestion || !securityAnswer">
        {{ loading ? 'Registrando...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
