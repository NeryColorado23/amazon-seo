<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-logo">&#9670;</span>
      <h1>Crear cuenta</h1>
      <p>Regístrate para optimizar tus listados</p>
    </div>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label for="name">Nombre completo</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Tu nombre" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" required />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Mínimo 6 caracteres" required />
      </div>

      <div class="form-group">
        <label for="company">Empresa (opcional)</label>
        <input id="company" type="text" [(ngModel)]="company" name="company" placeholder="Nombre de tu empresa" />
      </div>

      <p class="error-msg" *ngIf="error">{{ error }}</p>

      <button class="btn btn-primary btn-full" type="submit" [disabled]="loading || !name || !email || !password">
        {{ loading ? 'Registrando...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
