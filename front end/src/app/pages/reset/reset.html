<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-logo">🔐</span>
      <h1>Recuperar contraseña</h1>
    </div>

    <!-- PASO 1: Email -->
    <div *ngIf="step === 1">
      <p class="step-desc">Ingresa tu email para buscar tu cuenta.</p>
      <form (ngSubmit)="getQuestion()">
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email"
            placeholder="tu@email.com" required />
        </div>
        <p class="error-msg" *ngIf="error">{{ error }}</p>
        <button class="btn btn-primary btn-full" type="submit"
          [disabled]="loading || !email">
          {{ loading ? 'Buscando...' : 'Continuar' }}
        </button>
      </form>
    </div>

    <!-- PASO 2: Pregunta y nueva contraseña -->
    <div *ngIf="step === 2">
      <div class="question-box">
        <p class="question-label">Pregunta de seguridad:</p>
        <p class="question-text">{{ question }}</p>
      </div>

      <form (ngSubmit)="resetPassword()">
        <div class="form-group">
          <label>Tu respuesta</label>
          <input type="text" [(ngModel)]="securityAnswer" name="securityAnswer"
            placeholder="Respuesta..." required />
        </div>

        <div class="form-group">
          <label>Nueva contraseña</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword"
            placeholder="Mínimo 6 caracteres" required />
        </div>

        <div class="form-group">
          <label>Confirmar contraseña</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
            placeholder="Repite la contraseña" required />
        </div>

        <p class="error-msg" *ngIf="error">{{ error }}</p>

        <button class="btn btn-primary btn-full" type="submit"
          [disabled]="loading || !securityAnswer || !newPassword || !confirmPassword">
          {{ loading ? 'Actualizando...' : 'Actualizar contraseña' }}
        </button>
      </form>

      <button class="btn-back" (click)="step = 1; error = ''">← Volver</button>
    </div>

    <!-- PASO 3: Éxito -->
    <div *ngIf="step === 3" class="success-state">
      <span class="success-icon">✅</span>
      <h2>¡Contraseña actualizada!</h2>
      <p>{{ successMessage }}</p>
      <a routerLink="/login" class="btn btn-primary btn-full">Ir al login</a>
    </div>

    <p class="auth-footer" *ngIf="step !== 3">
      <a routerLink="/login">← Volver al login</a>
    </p>
  </div>
</div>
